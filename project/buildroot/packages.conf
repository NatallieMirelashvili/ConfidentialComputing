# Extra Buildroot packages for the Normal-World rootfs, applied by
# scripts/build.sh on every build. Each BR2_* line here is exported into the
# environment of the OP-TEE `make`, and build/common.mk's append-br2-vars
# macro folds every BR2_* environment variable into out-br/extra.conf - the
# last (and therefore winning) defconfig fragment fed to Buildroot. This
# keeps the package selection tracked in git even though .optee-workspace/
# (including Buildroot's .config) is generated and git-ignored.

# mbedTLS: libmbedcrypto provides base64 encode/decode for the Host CA.
# Note this is a second, Normal-World build of mbedTLS - separate from the
# copy already compiled into OP-TEE core as the Secure-World crypto backend,
# which is not linkable from Normal World.
BR2_PACKAGE_MBEDTLS=y

# cJSON: JSON building/parsing for the Host CA's device<->server messages.
BR2_PACKAGE_CJSON=y

# curl: gives edge_device.c's self-registration (edge_register_with_server(),
# shelled out to via system()) a real HTTPS client for POST
# /api/devices/register. BusyBox's built-in wget has no HTTPS support at all
# in this rootfs (no CONFIG_FEATURE_WGET_HTTPS), and the management server's
# TLS transport is pinned to TLS 1.3 only (CC_Server/server/transport/tls.py),
# which a minimal client couldn't negotiate anyway. Backed by mbedTLS (already
# a dependency above, and its config here has MBEDTLS_SSL_PROTO_TLS1_3 on) so
# no second TLS stack is pulled in - same tool scripts/register-device.sh
# already uses for this exact request from the host side.
BR2_PACKAGE_LIBCURL=y
BR2_PACKAGE_LIBCURL_CURL=y
BR2_PACKAGE_LIBCURL_MBEDTLS=y
